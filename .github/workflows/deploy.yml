name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test

    - name: Copy JAR to EC2
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "build/libs/Mine-server-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/deploy"
        strip_components: 2

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo mv /home/ubuntu/deploy/Mine-server-0.0.1-SNAPSHOT.jar /opt/mine/app.jar
          sudo systemctl restart mine
          sleep 10
          sudo systemctl status mine

    - name: Setup SSL and Nginx
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Nginx 및 Certbot 설치
          sudo apt-get update
          sudo apt-get install -y nginx certbot python3-certbot-nginx

          # 2. Nginx 설정 파일 생성 (항상 최신 상태로 덮어쓰기)
          sudo bash -c 'cat > /etc/nginx/sites-available/mine <<EOF
          server {
              listen 80;
              server_name api.minelover.com;

              location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;

                  # AI 생성 작업이 최대 5분 이상 걸릴 수 있음 - 타임아웃 설정 증가
                  proxy_read_timeout 360s;
                  proxy_send_timeout 360s;
                  proxy_connect_timeout 360s;
                  send_timeout 360s;
              }
          }
          EOF'
          sudo ln -sf /etc/nginx/sites-available/mine /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default

          # 3. Nginx 테스트 및 실행
          sudo nginx -t && sudo systemctl reload nginx

          # 4. SSL 인증서 발급 (인증서가 없을 때만 실행)
          if [ ! -d /etc/letsencrypt/live/api.minelover.com ]; then
            sudo certbot --nginx -d api.minelover.com --non-interactive --agree-tos -m jangjimin9766@gmail.com
          fi

    - name: Discord Notification
      if: always()
      continue-on-error: true
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        JOB_STATUS: ${{ job.status }}
      run: |
        if [ -z "$DISCORD_WEBHOOK" ]; then
          echo "DISCORD_WEBHOOK is not set. Skipping notification."
          exit 0
        fi

        if [ "$JOB_STATUS" = "success" ]; then
          TITLE="배포 완료"
          COLOR=65280
        else
          TITLE="배포 실패"
          COLOR=16711680
        fi

        jq -n \
          --arg title "$TITLE" \
          --arg branch "${{ github.ref_name }}" \
          --arg commit "${{ github.sha }}" \
          --arg actor "${{ github.actor }}" \
          --argjson color "$COLOR" \
          '{embeds: [{title: $title, description: ("**환경**: Production (EC2)\n**브랜치**: `" + $branch + "`\n**커밋**: `" + $commit + "`\n**실행자**: " + $actor), color: $color}]}' \
          | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" \
          || echo "Discord notification failed. Ignoring notification failure."

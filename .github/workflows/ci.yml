name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  core-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/mine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: mine_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Prepare Gradle wrapper
      run: chmod +x gradlew

    - name: Run core API tests
      run: ./gradlew coreApiTest

    - name: Build application
      run: ./gradlew build -x test

    - name: Discord Notification
      uses: sarisia/actions-status-discord@v1
      if: always()
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        title: "CI 테스트 ${{ job.status == 'success' && '성공 ✅' || '실패 ❌' }}"
        description: |
          **브랜치**: `${{ github.ref_name }}`
          **커밋**: `${{ github.sha }}`
          **실행자**: ${{ github.actor }}
        color: ${{ job.status == 'success' && '0x00FF00' || 'FF0000' }}

name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  core-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/mine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: mine_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Prepare Gradle wrapper
      run: chmod +x gradlew

    - name: Run core API tests
      run: ./gradlew coreApiTest

    - name: Build application
      run: ./gradlew build -x test

    - name: Discord Notification
      if: always()
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        JOB_STATUS: ${{ job.status }}
      run: |
        if [ -z "$DISCORD_WEBHOOK" ]; then
          echo "DISCORD_WEBHOOK is not set. Skipping notification."
          exit 0
        fi

        if [ "$JOB_STATUS" = "success" ]; then
          TITLE="CI 테스트 성공"
          COLOR=65280
        else
          TITLE="CI 테스트 실패"
          COLOR=16711680
        fi

        jq -n \
          --arg title "$TITLE" \
          --arg branch "${{ github.ref_name }}" \
          --arg commit "${{ github.sha }}" \
          --arg actor "${{ github.actor }}" \
          --argjson color "$COLOR" \
          '{embeds: [{title: $title, description: ("**브랜치**: `" + $branch + "`\n**커밋**: `" + $commit + "`\n**실행자**: " + $actor), color: $color}]}' \
          | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
